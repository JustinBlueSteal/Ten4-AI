# Runs your agent duties in the cloud (free GitHub minutes), so your PC doesn't have to be on.
# Setup: repo Settings > Secrets and variables > Actions > add secret GEMINI_API_KEY.
#        repo Settings > Actions > General > Workflow permissions > "Read and write" + allow Actions to create pull requests.
name: Agent
on:
  workflow_dispatch:
    inputs:
      duty:
        description: "Duty id to run (see agent/duties/). Leave blank to run all 'nightly' duties."
        required: false
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily. Edit or delete this block to change/stop the schedule.
permissions:
  contents: write
  pull-requests: write
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aider-chat
      - run: |
          git config user.name "ten4-text-agent"
          git config user.email "agent@users.noreply.github.com"
      - name: Run duty
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.duty }}" ]; then
            node agent/run.mjs "${{ github.event.inputs.duty }}" --pr
          else
            node agent/run.mjs --schedule nightly --pr
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-logs
          path: agent/logs/
          if-no-files-found: ignore
